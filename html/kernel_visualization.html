<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Magic Shape Detective - CNN Filters</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- KaTeX CSS and JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

    <style>
        /* Custom Animations */
        @keyframes slideKernel {
            0% {
                transform: translate(0px, 0px);
            }

            15% {
                transform: translate(48px, 0px);
            }

            30% {
                transform: translate(96px, 0px);
            }

            45% {
                transform: translate(0px, 48px);
            }

            60% {
                transform: translate(48px, 48px);
            }

            75% {
                transform: translate(96px, 48px);
            }

            90% {
                transform: translate(0px, 96px);
            }

            100% {
                transform: translate(0px, 0px);
            }
        }

        .animate-sliding-kernel {
            animation: slideKernel 6s infinite ease-in-out;
        }

        /* Interactive Grid Blocks */
        .lego-block {
            transition: all 0.2s ease;
        }

        .lego-block.active {
            background-color: #4F46E5;
            /* Indigo 600 */
            border-color: #3730A3;
            /* Indigo 800 */
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.2), 0 4px 6px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px);
            color: white;
        }

        .lego-block.inactive {
            background-color: #F3F4F6;
            /* Gray 100 */
            border-color: #D1D5DB;
            /* Gray 300 */
            color: #9CA3AF;
        }
    </style>
</head>

<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="max-w-5xl w-full bg-white rounded-2xl shadow-2xl overflow-hidden flex flex-col h-[85vh] md:h-[80vh]">

        <!-- Header -->
        <header class="bg-indigo-600 text-white p-6 flex justify-between items-center shrink-0">
            <div>
                <h1 class="text-2xl font-bold flex items-center gap-2">
                    🕵️‍♂️ The Magic Shape Detective
                </h1>
                <p class="text-indigo-100 text-sm mt-1">Understanding Convolutional Neural Networks (CNNs)</p>
            </div>
            <div class="text-right">
                <span class="text-sm font-medium bg-indigo-800 px-3 py-1 rounded-full" id="step-counter">Step 1 of
                    7</span>
            </div>
        </header>

        <!-- Main Content Area -->
        <div class="flex-1 flex flex-col md:flex-row overflow-hidden">

            <!-- Left Side: Text Explanation -->
            <div class="w-full md:w-1/2 p-6 md:p-8 overflow-y-auto border-b md:border-b-0 md:border-r border-slate-200"
                id="text-container">
                <!-- Text injected via JS -->
            </div>

            <!-- Right Side: Visualization -->
            <div class="w-full md:w-1/2 bg-slate-50 p-6 flex items-center justify-center relative overflow-hidden"
                id="visual-container">
                <!-- Visuals injected via JS -->
            </div>

        </div>

        <!-- Footer / Controls -->
        <footer class="bg-white p-4 border-t border-slate-200 flex justify-between items-center shrink-0">
            <button id="btn-back"
                class="px-6 py-2.5 rounded-lg font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                &larr; Back
            </button>

            <div class="flex gap-1" id="progress-dots">
                <!-- Dots injected via JS -->
            </div>

            <button id="btn-next"
                class="px-6 py-2.5 rounded-lg font-semibold text-white bg-indigo-600 hover:bg-indigo-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed shadow-md hover:shadow-lg">
                Next Step &rarr;
            </button>
        </footer>

    </div>

    <script src="../js/kernel_visualization.js"></script>
</body>

</html>
