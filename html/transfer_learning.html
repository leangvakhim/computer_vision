<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfer Learning & Fine-Tuning Visualizer</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Configure MathJax to recognize $ for inline math -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            }
        };
    </script>
    <!-- MathJax for rendering equations -->
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .layer-box {
            transition: all 0.4s ease;
        }

        .frozen {
            background-color: #e5e7eb;
            border-color: #9ca3af;
            color: #6b7280;
        }

        .unfrozen-base {
            background-color: #fef08a;
            border-color: #eab308;
            color: #854d0e;
        }

        .new-layer {
            background-color: #bbf7d0;
            border-color: #22c55e;
            color: #166534;
        }

        .original-layer {
            background-color: #bfdbfe;
            border-color: #3b82f6;
            color: #1e3a8a;
        }
    </style>
</head>

<body class="bg-gray-50 min-h-screen flex items-center justify-center font-sans p-4">

    <div
        class="bg-white max-w-5xl w-full rounded-2xl shadow-xl border border-gray-100 overflow-hidden flex flex-col h-[800px] md:h-[700px]">

        <!-- Header & Progress -->
        <div class="px-8 pt-8 pb-4 border-b border-gray-100">
            <h1 class="text-3xl font-bold text-gray-800 mb-6">Transfer Learning & Fine-Tuning in CV</h1>

            <!-- Progress Bar -->
            <div class="flex items-center justify-between relative">
                <div class="absolute left-0 top-1/2 transform -translate-y-1/2 w-full h-1 bg-gray-200 rounded -z-10">
                </div>
                <div id="progress-fill"
                    class="absolute left-0 top-1/2 transform -translate-y-1/2 h-1 bg-blue-600 rounded -z-10 transition-all duration-500 w-0">
                </div>

                <!-- Dots generated by JS -->
                <div id="progress-dots" class="w-full flex justify-between"></div>
            </div>
        </div>

        <!-- Content Area -->
        <div class="flex-1 overflow-y-auto p-8 relative">
            <div id="step-content" class="fade-in h-full flex flex-col">
                <!-- Dynamic Content Goes Here -->
            </div>
        </div>

        <!-- Footer / Controls -->
        <div class="px-8 py-5 border-t border-gray-100 flex justify-between items-center bg-gray-50 rounded-b-2xl">
            <button id="btn-prev"
                class="px-6 py-2.5 rounded-lg font-medium text-gray-600 hover:text-gray-900 hover:bg-gray-200 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                &larr; Previous Step
            </button>
            <div id="step-counter" class="text-sm font-semibold text-gray-500">Step 1 of 5</div>
            <button id="btn-next"
                class="px-6 py-2.5 rounded-lg font-medium bg-blue-600 text-white hover:bg-blue-700 transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
                Next Step &rarr;
            </button>
        </div>

    </div>

    <script src="../js/transfer_learning.js"></script>
</body>

</html>
