<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResNet: The Skip Connection Explained</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- KaTeX for Math Formulas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css"
        xintegrity="sha384-GvrOXuhMATgEsSwCs4smul74iXGOixntILdUW9XmUC6+HX0sLNAK3q71PTvL/30V" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"
        xintegrity="sha384-cpW21h6RZv/phavutF+AuVYrr+dA8xD9zs6FwLpaCct6O9ctzYFfXb3qxx2E/31x"
        crossorigin="anonymous"></script>

    <style>
        /* Smooth transitions for elements */
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* SVG Styling */
        svg text {
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .svg-box {
            fill: #f3f4f6;
            stroke: #4b5563;
            stroke-width: 2;
            rx: 8;
        }

        .svg-box-text {
            fill: #1f2937;
            font-weight: 600;
            font-size: 14px;
        }
    </style>
</head>

<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 sm:p-8 font-sans text-slate-800">

    <div class="max-w-5xl w-full bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col h-[850px] sm:h-[700px]">

        <!-- Header -->
        <div class="bg-indigo-600 text-white p-6 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold">Understanding ResNet</h1>
                <p class="text-indigo-200 text-sm mt-1">The Telephone Game & Skip Connections</p>
            </div>
            <div class="bg-indigo-800 px-4 py-2 rounded-lg font-mono text-sm shadow-inner">
                Step <span id="step-counter">1</span> of 6
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="flex-1 flex flex-col md:flex-row overflow-hidden relative">

            <!-- Left: Text Explanation -->
            <div
                class="w-full md:w-5/12 p-6 md:p-8 overflow-y-auto border-b md:border-b-0 md:border-r border-slate-200 bg-slate-50/50">
                <h2 id="step-title" class="text-xl font-bold text-indigo-700 mb-4 fade-in">Title</h2>
                <div id="step-content" class="text-slate-700 leading-relaxed space-y-4 fade-in text-lg">
                    <!-- Content injected via JS -->
                </div>

                <!-- Math Formula Container -->
                <div id="math-container"
                    class="mt-6 p-4 bg-white border border-slate-200 rounded-lg shadow-sm text-center hidden fade-in text-xl">
                    <!-- Formula injected via JS -->
                </div>
            </div>

            <!-- Right: Visualization -->
            <div class="w-full md:w-7/12 bg-white flex items-center justify-center p-4 relative overflow-hidden">
                <div id="visual-container" class="w-full h-full flex items-center justify-center fade-in">
                    <!-- SVG injected via JS -->
                </div>
            </div>
        </div>

        <!-- Footer / Controls -->
        <div class="bg-slate-100 p-4 border-t border-slate-200 flex justify-between items-center">
            <button id="btn-back"
                class="px-6 py-2.5 rounded-lg font-semibold transition-all duration-200 flex items-center gap-2 bg-white border border-slate-300 text-slate-600 hover:bg-slate-50 hover:text-indigo-600 disabled:opacity-40 disabled:cursor-not-allowed">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
                Back
            </button>

            <div class="flex space-x-1" id="progress-dots">
                <!-- Dots injected via JS -->
            </div>

            <button id="btn-next"
                class="px-6 py-2.5 rounded-lg font-semibold transition-all duration-200 flex items-center gap-2 bg-indigo-600 text-white hover:bg-indigo-700 hover:shadow-md hover:-translate-y-0.5 disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:translate-y-0">
                Next
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
            </button>
        </div>
    </div>

    <script src="../js/resnet.js"></script>
</body>

</html>
