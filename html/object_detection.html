<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How AI Plays "I Spy" - Object Detection Explained</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- KaTeX for LaTeX Math Formatting -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        /* Custom Animations */
        @keyframes slideWindow {
            0% {
                transform: translate(0, 0);
            }

            20% {
                transform: translate(120px, 0);
            }

            25% {
                transform: translate(0, 40px);
            }

            45% {
                transform: translate(120px, 40px);
            }

            50% {
                transform: translate(0, 80px);
            }

            70% {
                transform: translate(120px, 80px);
            }

            75% {
                transform: translate(0, 120px);
            }

            95% {
                transform: translate(120px, 120px);
            }

            100% {
                transform: translate(0, 0);
            }
        }

        .animate-sliding-window {
            animation: slideWindow 6s infinite ease-in-out;
        }

        @keyframes pulse-border {
            0% {
                border-color: rgba(239, 68, 68, 0.4);
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4);
            }

            70% {
                border-color: rgba(239, 68, 68, 1);
                box-shadow: 0 0 0 10px rgba(239, 68, 68, 0);
            }

            100% {
                border-color: rgba(239, 68, 68, 0.4);
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
            }
        }

        .ai-box {
            animation: pulse-border 2s infinite;
        }

        /* Range Slider Styling */
        input[type=range] {
            accent-color: #3b82f6;
        }

        .fade-transition {
            transition: opacity 0.4s ease-in-out, transform 0.4s ease-in-out;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col selection:bg-blue-200">

    <!-- Header Section -->
    <header class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <i class="ph ph-robot text-3xl text-blue-600"></i>
                <h1 class="text-xl font-bold text-slate-800">AI "I Spy": Object Detection</h1>
            </div>
            <!-- Progress Bar Indicator -->
            <div class="flex gap-1" id="progress-dots">
                <!-- Dots generated by JS -->
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-6xl mx-auto w-full px-4 py-8 flex flex-col md:flex-row gap-8 items-stretch relative">

        <!-- Left Panel: Text & Math Content -->
        <div
            class="w-full md:w-1/2 flex flex-col bg-white rounded-2xl shadow-lg border border-slate-100 overflow-hidden relative">
            <div class="p-8 flex-grow overflow-y-auto" id="text-content">
                <!-- Content generated by JS -->
            </div>

            <!-- Navigation Controls inside the card -->
            <div class="bg-slate-50 border-t border-slate-100 p-4 flex justify-between items-center mt-auto">
                <button id="btn-back"
                    class="flex items-center gap-2 px-5 py-2.5 rounded-lg text-slate-600 font-medium hover:bg-slate-200 transition-colors disabled:opacity-40 disabled:cursor-not-allowed">
                    <i class="ph ph-arrow-left font-bold"></i> Back
                </button>
                <div id="step-counter" class="text-sm font-semibold text-slate-400 tracking-wide">
                    STEP 1 OF 8
                </div>
                <button id="btn-next"
                    class="flex items-center gap-2 px-5 py-2.5 rounded-lg bg-blue-600 text-white font-medium hover:bg-blue-700 transition-colors disabled:opacity-40 disabled:cursor-not-allowed shadow-md shadow-blue-200">
                    Next <i class="ph ph-arrow-right font-bold"></i>
                </button>
            </div>
        </div>

        <!-- Right Panel: Visualizations -->
        <div class="w-full md:w-1/2 flex items-center justify-center bg-slate-100 rounded-2xl shadow-inner border border-slate-200 p-6 min-h-[400px] overflow-hidden"
            id="visual-content">
            <!-- Visuals generated by JS -->
        </div>

    </main>

    <script src="../js/object_detection.js"></script>
</body>

</html>
