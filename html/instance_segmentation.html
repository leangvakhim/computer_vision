<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNN & Instance Segmentation Visualizer</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- KaTeX for Math Formatting -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Custom Animations */
        .fade-in {
            animation: fadeIn 0.5s ease-in-out forwards;
        }

        .slide-up {
            animation: slideUp 0.5s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Grid transition for the math step */
        .pixel-cell {
            transition: all 0.4s ease;
        }

        /* Object outlines */
        .dog-shape {
            transition: all 0.5s ease;
            stroke-width: 4;
            fill: transparent;
            stroke: #4b5563;
        }

        .box-outline {
            transition: all 0.5s ease;
            stroke-width: 3;
            stroke: #eab308;
            stroke-dasharray: 8;
            fill: transparent;
            opacity: 0;
        }

        .blob-text {
            opacity: 0;
            transition: opacity 0.5s;
            font-weight: bold;
            fill: #1f2937;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800 min-h-screen flex items-center justify-center p-4 md:p-8 font-sans">

    <div class="max-w-6xl w-full bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col h-[85vh] min-h-[600px]">

        <!-- Header & Progress -->
        <div class="bg-slate-900 text-white p-6 border-b border-slate-800">
            <h1 class="text-2xl md:text-3xl font-bold mb-4"><i class="fa-solid fa-brain text-blue-400 mr-3"></i>CNN
                Concepts: Instance Segmentation</h1>

            <!-- Progress Bar -->
            <div class="relative w-full h-2 bg-slate-700 rounded-full">
                <div id="progress-bar"
                    class="absolute top-0 left-0 h-full bg-blue-500 rounded-full transition-all duration-500 ease-out"
                    style="width: 0%;"></div>
            </div>
            <div class="flex justify-between text-xs text-slate-400 mt-2 font-medium tracking-wide uppercase"
                id="step-indicators">
                <!-- Injected via JS -->
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="flex-1 flex flex-col md:flex-row overflow-hidden relative">

            <!-- Visualization Panel (Left) -->
            <div
                class="w-full md:w-3/5 bg-slate-100 flex items-center justify-center p-8 relative border-b md:border-b-0 md:border-r border-gray-200">
                <div id="visual-container"
                    class="w-full max-w-md aspect-square relative flex items-center justify-center">
                    <!-- SVG / Visuals Injected Here -->
                </div>
            </div>

            <!-- Explanation Panel (Right) -->
            <div class="w-full md:w-2/5 p-6 md:p-10 overflow-y-auto flex flex-col justify-center">
                <div id="text-content" class="slide-up">
                    <h2 id="step-title" class="text-2xl font-bold text-slate-900 mb-4">Title</h2>
                    <div id="step-description" class="text-lg text-slate-600 leading-relaxed space-y-4 mb-6 overflow-y-scroll max-h-48">
                        Description goes here.
                    </div>

                    <!-- Math Container (Hidden by default) -->
                    <div id="math-container"
                        class="overflow-x-scroll bg-blue-50 p-6 rounded-xl border border-blue-100 shadow-inner text-center my-6 text-xl text-slate-800">
                    </div>
                </div>
            </div>

        </div>

        <!-- Navigation Controls -->
        <div class="bg-gray-50 p-6 border-t border-gray-200 flex justify-between items-center">
            <button id="btn-back"
                class="px-6 py-3 rounded-lg font-semibold text-slate-600 hover:bg-slate-200 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                <i class="fa-solid fa-arrow-left mr-2"></i> Back
            </button>
            <div class="text-sm font-medium text-slate-500">
                Step <span id="current-step-label">1</span> of <span id="total-step-label">X</span>
            </div>
            <button id="btn-next"
                class="px-6 py-3 rounded-lg font-semibold bg-blue-600 text-white hover:bg-blue-700 shadow-md hover:shadow-lg transition-all transform hover:-translate-y-0.5 disabled:opacity-50">
                Next <i class="fa-solid fa-arrow-right ml-2"></i>
            </button>
        </div>

    </div>

    <script src="../js/instance_segmentation.js"></script>
</body>

</html>
