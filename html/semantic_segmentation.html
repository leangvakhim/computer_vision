<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Segmentation Interactive Playground</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- KaTeX for Math Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css"
        xintegrity="sha384-GvrOXuhMATgEsSwCs4smul74iXGOixntILdUW9XmUC6+HX0sLNAK3q71bZBTIQHQ" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"
        xintegrity="sha384-cpW21T6RZ0BqBOqfyGfZEeZ91H/++R4Pmcb89D+uVRXG3z8e1Z/t9/P1oEpxw27O"
        crossorigin="anonymous"></script>

    <style>
        .pixel-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            grid-template-rows: repeat(10, 1fr);
            gap: 1px;
            background-color: #e5e7eb;
            border: 2px solid #9ca3af;
            position: relative;
            width: 100%;
            max-width: 480px;
            aspect-ratio: 12/10;
            margin: 0 auto;
        }

        .pixel {
            background-color: white;
            transition: background-color 0.5s ease;
            position: relative;
        }

        /* Base Original Image Colors (Grayscale representation) */
        .sky-orig {
            background-color: #d1d5db;
        }

        .car-orig {
            background-color: #4b5563;
        }

        .road-orig {
            background-color: #1f2937;
        }

        /* Segmented Colors */
        .sky-seg {
            background-color: #bae6fd;
        }

        /* Light blue */
        .car-seg {
            background-color: #ef4444;
        }

        /* Red */
        .road-seg {
            background-color: #374151;
        }

        /* Dark Gray */

        .magnifying-glass {
            position: absolute;
            border: 3px solid #3b82f6;
            /* Blue border */
            background-color: rgba(59, 130, 246, 0.2);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 10;
            display: none;
        }

        .pulse-border {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(239, 68, 68, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
            }
        }

        .bar-fill {
            transition: width 0.5s ease-out;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <header class="bg-indigo-600 text-white p-6 shadow-md">
        <div class="max-w-4xl mx-auto">
            <h1 class="text-3xl font-bold">The Magic Coloring Book</h1>
            <p class="text-indigo-100 mt-2 text-lg">Understanding Semantic Segmentation step-by-step.</p>
        </div>
    </header>

    <main class="flex-grow flex flex-col md:flex-row max-w-6xl mx-auto w-full p-4 md:p-8 gap-8">

        <!-- Left Column: Visuals -->
        <div class="w-full md:w-1/2 flex flex-col">
            <div class="bg-white p-4 rounded-xl shadow-lg border border-gray-100 flex-grow flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold text-gray-700" id="visual-title">The Grid Paper</h2>
                    <span id="step-counter"
                        class="bg-indigo-100 text-indigo-800 text-sm font-medium px-3 py-1 rounded-full">Step 1/6</span>
                </div>

                <div class="flex-grow flex items-center justify-center relative min-h-[300px]">
                    <div id="grid-container" class="pixel-grid shadow-inner">
                        <!-- Pixels injected by JS -->
                        <div id="magnifying-glass" class="magnifying-glass rounded"></div>
                    </div>
                </div>

                <!-- Interactive Elements specific to steps -->
                <div id="scoreboard-container" class="mt-6 hidden bg-gray-50 p-4 rounded-lg border border-gray-200">
                    <h3 class="text-sm font-bold text-gray-600 uppercase tracking-wider mb-2">Pixel Scoreboard (Logits)
                    </h3>
                    <div class="space-y-2">
                        <div class="flex items-center">
                            <span class="w-16 font-semibold text-red-500">Car</span>
                            <div class="flex-grow bg-gray-200 rounded-full h-4 overflow-hidden relative">
                                <div id="score-car" class="bar-fill bg-red-500 h-full w-0"></div>
                            </div>
                            <span id="val-car" class="w-12 text-right text-sm font-mono ml-2">0</span>
                        </div>
                        <div class="flex items-center">
                            <span class="w-16 font-semibold text-gray-700">Road</span>
                            <div class="flex-grow bg-gray-200 rounded-full h-4 overflow-hidden relative">
                                <div id="score-road" class="bar-fill bg-gray-600 h-full w-0"></div>
                            </div>
                            <span id="val-road" class="w-12 text-right text-sm font-mono ml-2">0</span>
                        </div>
                        <div class="flex items-center">
                            <span class="w-16 font-semibold text-blue-400">Sky</span>
                            <div class="flex-grow bg-gray-200 rounded-full h-4 overflow-hidden relative">
                                <div id="score-sky" class="bar-fill bg-blue-400 h-full w-0"></div>
                            </div>
                            <span id="val-sky" class="w-12 text-right text-sm font-mono ml-2">0</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Column: Explanations -->
        <div class="w-full md:w-1/2 flex flex-col justify-between">
            <div class="bg-white p-6 rounded-xl shadow-lg border border-gray-100 flex-grow">
                <h2 id="content-title" class="text-2xl font-bold text-indigo-700 mb-4">The Setup</h2>

                <div id="content-text" class="prose prose-lg text-gray-600 mb-6 min-h-[150px]">
                    <!-- Text injected by JS -->
                </div>

                <!-- Math Formula Area -->
                <div id="math-container" class="hidden bg-indigo-50 border-l-4 border-indigo-400 p-4 mb-6 rounded-r-lg">
                    <p class="text-sm font-semibold text-indigo-800 mb-2 uppercase tracking-wide">The Math behind it:
                    </p>
                    <div id="katex-render" class="text-center text-lg overflow-x-auto py-2"></div>
                </div>
            </div>

            <!-- Navigation Controls -->
            <div class="flex justify-between items-center mt-6 bg-white p-4 rounded-xl shadow border border-gray-200">
                <button id="btn-back"
                    class="px-6 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                    &larr; Back
                </button>
                <div class="flex space-x-1" id="step-dots">
                    <!-- Dots injected by JS -->
                </div>
                <button id="btn-next"
                    class="px-6 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg transition-colors shadow-md disabled:opacity-50 disabled:cursor-not-allowed">
                    Next &rarr;
                </button>
            </div>
        </div>

    </main>

    <script src="../js/semantic_segmentation.js"></script>
</body>

</html>
