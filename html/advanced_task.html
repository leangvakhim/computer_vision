<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Computer Vision Tasks</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MathJax for rendering LaTeX equations -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            startup: {
                typeset: false // We will trigger it manually after DOM updates
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            /* Very light slate for contrast against the white card */
        }

        .step-transition {
            transition: opacity 0.4s ease-in-out, transform 0.4s ease-in-out;
        }

        .fade-out {
            opacity: 0;
            transform: translateY(10px);
        }

        .fade-in {
            opacity: 1;
            transform: translateY(0);
        }

        /* SVG Animation classes */
        .dash-anim {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: dash 2s linear forwards;
        }

        @keyframes dash {
            to {
                stroke-dashoffset: 0;
            }
        }

        .pulse {
            animation: pulse-anim 2s infinite;
        }

        @keyframes pulse-anim {
            0% {
                transform: scale(0.95);
                opacity: 0.8;
            }

            50% {
                transform: scale(1.05);
                opacity: 1;
            }

            100% {
                transform: scale(0.95);
                opacity: 0.8;
            }
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4 text-slate-800">

    <!-- Main Container -->
    <div
        class="bg-white rounded-2xl shadow-xl w-full max-w-4xl overflow-hidden border border-slate-100 flex flex-col h-[750px] max-h-[95vh]">

        <!-- Header -->
        <div class="px-8 py-6 border-b border-slate-100 flex justify-between items-center bg-white shrink-0">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">Advanced Computer Vision</h1>
                <p class="text-sm text-slate-500 mt-1">A step-by-step visual guide to Deep Learning in CV</p>
            </div>
            <div class="text-right">
                <span class="text-sm font-semibold text-blue-600 bg-blue-50 px-3 py-1 rounded-full"
                    id="step-counter">Step 1 of 6</span>
            </div>
        </div>

        <!-- Progress Bar -->
        <div class="w-full bg-slate-100 h-1.5 shrink-0">
            <div id="progress-bar" class="bg-blue-600 h-1.5 transition-all duration-500 ease-out w-0"></div>
        </div>

        <!-- Content Area -->
        <div class="flex-grow p-8 flex flex-col items-center relative overflow-y-auto bg-white">
            <div id="content-container"
                class="w-full max-w-2xl step-transition fade-in flex flex-col items-center text-center my-auto py-4">
                <!-- Title & Description injected here -->
                <h2 id="step-title" class="text-3xl font-bold text-slate-800 mb-4">Title</h2>
                <p id="step-desc" class="text-lg text-slate-600 mb-8 leading-relaxed">Description</p>

                <!-- Visual Box injected here -->
                <div id="step-visual"
                    class="w-full bg-slate-50 rounded-xl p-6 border border-slate-200 shadow-inner flex items-center justify-center min-h-[300px]">
                    <!-- Visuals -->
                </div>
            </div>
        </div>

        <!-- Footer / Controls -->
        <div class="px-8 py-6 border-t border-slate-100 bg-slate-50 flex justify-between items-center shrink-0">
            <button id="btn-prev"
                class="px-6 py-2.5 rounded-lg font-medium text-slate-600 bg-white border border-slate-200 hover:bg-slate-100 hover:text-slate-900 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                &larr; Previous Step
            </button>

            <div class="flex gap-2" id="dot-indicators">
                <!-- Dots injected via JS -->
            </div>

            <button id="btn-next"
                class="px-6 py-2.5 rounded-lg font-medium text-white bg-blue-600 hover:bg-blue-700 shadow-sm transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                Next Step &rarr;
            </button>
        </div>
    </div>

    <script src="../js/advanced_task.js"></script>
</body>

</html>
