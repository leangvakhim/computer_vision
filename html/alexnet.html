<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlexNet: The Detective Factory</title>

    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- KaTeX for rendering mathematical formulas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

    <style>
        /* Smooth transitions for slide changes */
        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .visual-container svg {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4 font-sans">

    <!-- Main Presentation Card -->
    <div
        class="bg-white rounded-2xl shadow-2xl overflow-hidden w-full max-w-4xl border border-slate-200 flex flex-col h-[85vh]">

        <!-- Header & Progress -->
        <div class="p-6 border-b border-slate-200 bg-white/80 backdrop-blur-sm z-10">
            <h1 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-emerald-600"
                id="main-title">
                AlexNet: The Detective Factory
            </h1>
            <div class="w-full bg-slate-200 rounded-full h-2 mt-4 overflow-hidden">
                <div class="bg-blue-500 h-2 rounded-full transition-all duration-300 ease-out" id="progress-bar"
                    style="width: 10%"></div>
            </div>
            <div class="flex justify-between text-xs text-slate-500 mt-2 font-medium tracking-wider uppercase"
                id="step-indicator">
                Step 1 of X
            </div>
        </div>

        <!-- Content Area -->
        <div class="flex-1 overflow-y-auto p-6 md:p-8 custom-scrollbar">
            <div id="slide-content" class="fade-in space-y-8">

                <!-- Visual Box -->
                <div class="w-full h-64 md:h-72 bg-slate-50 rounded-xl border border-slate-200 flex items-center justify-center p-4 shadow-inner visual-container"
                    id="visual-container">
                    <!-- Dynamic SVG Visuals get injected here -->
                </div>

                <!-- Text Explanation -->
                <div class="space-y-4">
                    <h2 class="text-2xl font-semibold text-slate-900" id="slide-title">Slide Title</h2>
                    <p class="text-lg text-slate-700 leading-relaxed" id="slide-text">
                        Description text goes here.
                    </p>
                </div>

                <!-- Formula Box (Hidden if no formula) -->
                <div id="formula-box" class="bg-slate-100 p-6 rounded-xl border border-slate-300 hidden">
                    <h3 class="text-sm uppercase tracking-wider text-slate-500 mb-2 font-semibold">The Math Behind It
                    </h3>
                    <div id="formula-container" class="text-xl text-center overflow-x-auto text-blue-800">
                        <!-- KaTeX injected here -->
                    </div>
                </div>

            </div>
        </div>

        <!-- Footer Controls -->
        <div class="p-6 border-t border-slate-200 bg-slate-50 flex justify-between items-center mt-auto">
            <button id="btn-prev"
                class="px-6 py-3 rounded-lg font-semibold bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-30 disabled:hover:bg-slate-200 transition-colors flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m15 18-6-6 6-6" />
                </svg>
                Back
            </button>
            <button id="btn-next"
                class="px-6 py-3 rounded-lg font-semibold bg-blue-600 text-white hover:bg-blue-500 disabled:opacity-30 disabled:hover:bg-blue-600 transition-colors flex items-center gap-2 shadow-lg shadow-blue-500/20">
                Next
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m9 18 6-6-6-6" />
                </svg>
            </button>
        </div>
    </div>

    <script src="../js/alexnet.js"></script>
</body>

</html>
