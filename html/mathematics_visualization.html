<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Math for Beginners</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- KaTeX CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
        xintegrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
        xintegrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
        xintegrity="sha384-+VBxd3r6XgURycqtZ117nYw44OOcIax56Z4dCRWbOxyj0O1rxVqVGhHfeTdfOW+J"
        crossorigin="anonymous"></script>

    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .step-container {
            min-height: 400px;
        }
    </style>
</head>

<body class="bg-slate-100 font-sans text-slate-800 antialiased min-h-screen flex items-center justify-center p-4">

    <div
        class="max-w-4xl w-full bg-white rounded-3xl shadow-xl overflow-hidden flex flex-col h-full border border-slate-200">

        <!-- Header / Progress Bar -->
        <div class="bg-indigo-600 text-white p-6 relative">
            <h1 class="text-2xl md:text-3xl font-bold flex items-center gap-3">
                <i class="fa-solid fa-book-open"></i> AI Math Storyboard
            </h1>
            <p class="text-indigo-200 mt-2 text-sm md:text-base">Understanding CNN concepts through simple stories.</p>

            <div class="mt-6 bg-indigo-800 rounded-full h-2.5 overflow-hidden">
                <div id="progress-bar" class="bg-yellow-400 h-2.5 rounded-full transition-all duration-500 ease-out"
                    style="width: 9.09%"></div>
            </div>
            <div class="mt-2 text-xs font-semibold tracking-wide text-indigo-200 uppercase flex justify-between">
                <span>Start</span>
                <span id="step-indicator">Step 1 of 11</span>
                <span>Finish</span>
            </div>
        </div>

        <!-- Content Area -->
        <div class="p-6 md:p-10 flex-grow step-container flex flex-col justify-center bg-slate-50 relative overflow-y-auto"
            id="content-area">
            <!-- Dynamic Content will be injected here -->
        </div>

        <!-- Footer / Navigation -->
        <div class="p-6 border-t border-slate-200 bg-white flex justify-between items-center">
            <button id="btn-back" onclick="prevStep()"
                class="px-6 py-3 rounded-xl font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 transition-colors flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                <i class="fa-solid fa-arrow-left"></i> Back
            </button>
            <button id="btn-next" onclick="nextStep()"
                class="px-6 py-3 rounded-xl font-bold text-white bg-indigo-600 hover:bg-indigo-700 transition-colors shadow-lg shadow-indigo-200 flex items-center gap-2">
                Next <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </div>

    <script src="../js/mathematics_visualization.js"></script>
</body>

</html>
