<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeNet-5: The Robot Detective</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- KaTeX for Math Formulas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
        xintegrity="sha384-n8MVd4RsJOPaH4z04GDe146v44kZ21ASb0OEXzxyyxIfZ2d0d01Yx0rGgP1G6g6D" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
        xintegrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
        xintegrity="sha384-+VBxd3r6XgURycqtZ117nYw44OOcIax56Z4dCRWbOskyxs926eK2eeU" crossorigin="anonymous"></script>

    <style>
        /* Custom Animations for Visualizations */
        @keyframes slideMagnifier {
            0% {
                top: 0%;
                left: 0%;
            }

            20% {
                top: 0%;
                left: 60%;
            }

            40% {
                top: 30%;
                left: 0%;
            }

            60% {
                top: 30%;
                left: 60%;
            }

            80% {
                top: 60%;
                left: 0%;
            }

            100% {
                top: 60%;
                left: 60%;
            }
        }

        .magnifier {
            animation: slideMagnifier 4s infinite linear;
        }

        @keyframes pulseShrink {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(0.8);
                opacity: 0.5;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .pool-anim {
            animation: pulseShrink 2s infinite ease-in-out;
        }

        @keyframes drawLine {
            from {
                stroke-dasharray: 100;
                stroke-dashoffset: 100;
            }

            to {
                stroke-dasharray: 100;
                stroke-dashoffset: 0;
            }
        }

        .connection-line {
            stroke-dasharray: 100;
            animation: drawLine 1.5s infinite alternate ease-in-out;
        }

        .grid-cell-dark {
            @apply bg-slate-700 border border-slate-800;
        }

        .grid-cell-light {
            @apply bg-slate-100 border border-slate-300;
        }

        .grid-cell-mid {
            @apply bg-slate-400 border border-slate-500;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col selection:bg-blue-200">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md py-6">
        <div class="max-w-5xl mx-auto px-4 flex items-center gap-4">
            <div class="text-4xl">🕵️‍♂️</div>
            <div>
                <h1 class="text-2xl md:text-3xl font-bold tracking-tight">LeNet-5: The Robot Detective</h1>
                <p class="text-indigo-200 text-sm md:text-base mt-1">Understanding Convolutional Neural Networks
                    step-by-step</p>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-5xl mx-auto w-full px-4 py-8 flex flex-col md:flex-row gap-8">

        <!-- Left Column: Visualizations -->
        <div class="w-full md:w-1/2 bg-white rounded-2xl shadow-lg border border-slate-200 p-6 flex flex-col justify-center items-center min-h-[400px] overflow-hidden"
            id="visual-container">
            <!-- Visual content gets injected here via JS -->
        </div>

        <!-- Right Column: Explanations -->
        <div class="w-full md:w-1/2 flex flex-col">
            <div class="bg-white rounded-2xl shadow-lg border border-slate-200 p-6 flex-grow relative pb-20">

                <!-- Progress Indicator -->
                <div class="flex gap-2 mb-6" id="progress-dots">
                    <!-- Dots injected via JS -->
                </div>

                <!-- Text Content -->
                <h2 class="text-2xl font-bold text-indigo-700 mb-4 flex items-center gap-2" id="step-title">
                    <!-- Title -->
                </h2>

                <div class="prose prose-slate max-w-none text-slate-600 space-y-4" id="step-content">
                    <!-- Text -->
                </div>

                <!-- Formula Box (Hidden if empty) -->
                <div id="formula-container"
                    class="mt-6 bg-indigo-50 border border-indigo-100 rounded-xl p-4 text-center hidden">
                    <span class="text-xs font-semibold text-indigo-400 uppercase tracking-wider mb-2 block">The Math
                        Behind It</span>
                    <div id="step-formula" class="text-indigo-900 overflow-x-auto py-2">
                        <!-- Formula -->
                    </div>
                </div>

                <!-- Navigation Buttons (Absolutely positioned at bottom of card) -->
                <div class="absolute bottom-6 left-6 right-6 flex justify-between pt-4 border-t border-slate-100">
                    <button id="btn-back"
                        class="px-5 py-2.5 rounded-lg font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                        &larr; Back
                    </button>
                    <button id="btn-next"
                        class="px-5 py-2.5 rounded-lg font-medium text-white bg-indigo-600 hover:bg-indigo-700 transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
                        Next Step &rarr;
                    </button>
                </div>

            </div>
        </div>
    </main>

    <!-- <footer class="text-center py-6 text-slate-400 text-sm">
        Built to explain CNN concepts simply.
    </footer> -->

    <script src="../js/lenet_5.js"></script>
</body>

</html>
