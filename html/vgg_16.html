<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VGG-16 & CNN Concepts Visualization</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- KaTeX CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Custom Animations */
        .fade-in {
            animation: fadeIn 0.5s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Convolution Animation */
        .conv-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 2px;
            width: 150px;
            height: 150px;
            position: relative;
            background: #e2e8f0;
            padding: 2px;
        }

        .conv-cell {
            background: white;
            border-radius: 2px;
        }

        .filter-box {
            position: absolute;
            width: calc(60% - 2px);
            /* 3x3 out of 5x5 roughly */
            height: calc(60% - 2px);
            border: 4px solid #3b82f6;
            /* Blue for conv */
            background: rgba(59, 130, 246, 0.2);
            top: 2px;
            left: 2px;
            animation: slideFilter 4s infinite alternate ease-in-out;
            pointer-events: none;
            border-radius: 4px;
        }

        @keyframes slideFilter {

            0%,
            10% {
                transform: translate(0, 0);
            }

            25%,
            35% {
                transform: translate(calc(100% + 2px), 0);
            }

            50%,
            60% {
                transform: translate(calc(66.6% + 2px), calc(66.6% + 2px));
            }

            75%,
            85% {
                transform: translate(0, calc(66.6% + 2px));
            }

            100% {
                transform: translate(0, 0);
            }
        }

        /* Large Filter Animation */
        .large-filter-box {
            position: absolute;
            width: calc(100% - 4px);
            /* Almost covers whole grid */
            height: calc(100% - 4px);
            border: 4px solid #ef4444;
            /* Red for old way */
            background: rgba(239, 68, 68, 0.2);
            top: 2px;
            left: 2px;
            border-radius: 4px;
        }

        /* Pooling Animation */
        .pool-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2px;
            width: 160px;
            height: 160px;
        }

        .pool-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            font-weight: bold;
            color: #475569;
        }

        .pool-highlight {
            background: #fed7aa;
            /* Orange for pool */
            border-color: #f97316;
            color: #c2410c;
        }

        .pool-result {
            width: 80px;
            height: 80px;
            background: #fed7aa;
            border: 2px solid #f97316;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.5rem;
            color: #c2410c;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <!-- Main App Container -->
    <div
        class="bg-white rounded-2xl shadow-xl border border-slate-200 w-full max-w-5xl flex flex-col overflow-hidden min-h-[600px]">

        <!-- Header -->
        <div class="bg-slate-900 text-white p-6 flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-bold tracking-tight">Understanding CNNs & VGG-16</h1>
                <p class="text-slate-400 text-sm mt-1">Explaining AI architecture simply</p>
            </div>
            <div class="flex items-center space-x-2 bg-slate-800 px-4 py-2 rounded-full border border-slate-700">
                <span class="text-sm font-medium text-slate-300">Step</span>
                <span id="step-indicator" class="text-lg font-bold text-blue-400">1</span>
                <span class="text-sm font-medium text-slate-300" id="total-steps">/ 8</span>
            </div>
        </div>

        <!-- Content Area -->
        <div class="flex-grow flex flex-col md:flex-row p-6 gap-8 relative overflow-hidden" id="content-container">

            <!-- Left Side: Visuals -->
            <div
                class="md:w-1/2 bg-slate-100 rounded-xl border border-slate-200 p-6 flex flex-col items-center justify-center min-h-[300px] relative">
                <div id="visual-area" class="w-full h-full flex flex-col items-center justify-center fade-in space-y-4">
                    <!-- Dynamic Visuals Inject Here -->
                </div>
            </div>

            <!-- Right Side: Explanation -->
            <div class="md:w-1/2 flex flex-col justify-center">
                <div id="text-area" class="fade-in">
                    <h2 id="step-title" class="text-2xl font-bold text-slate-800 mb-4">Title</h2>
                    <div id="step-desc" class="text-slate-600 space-y-4 text-lg leading-relaxed">
                        <!-- Dynamic Text Inject Here -->
                    </div>

                    <!-- Math Formula Area -->
                    <div id="math-container" class="mt-8 p-4 bg-blue-50 border border-blue-100 rounded-lg hidden">
                        <div class="text-xs font-semibold text-blue-500 uppercase tracking-wider mb-2">Mathematical
                            Concept</div>
                        <div id="math-formula" class="text-center overflow-x-auto py-2"></div>
                    </div>
                </div>
            </div>

        </div>

        <!-- Footer / Controls -->
        <div class="bg-slate-50 border-t border-slate-200 p-4 flex justify-between items-center px-8">
            <button id="btn-back"
                class="flex items-center space-x-2 px-6 py-2.5 rounded-lg font-medium text-slate-600 bg-white border border-slate-300 hover:bg-slate-50 hover:text-slate-900 transition-colors disabled:opacity-50 disabled:cursor-not-allowed shadow-sm">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
                <span>Back</span>
            </button>

            <div class="flex space-x-1" id="progress-dots">
                <!-- Dots injected via JS -->
            </div>

            <button id="btn-next"
                class="flex items-center space-x-2 px-6 py-2.5 rounded-lg font-medium text-white bg-blue-600 hover:bg-blue-700 transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
                <span>Next</span>
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
            </button>
        </div>
    </div>

    <script src="../js/vgg_16.js"></script>
</body>

</html>
